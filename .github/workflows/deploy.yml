name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Key into index.html and reviewer/reading.html
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for f in index.html reviewer/reading.html; do
            echo "Before injection ($f):"
            grep "const apiKey" "$f" || echo "Pattern not found"

            # Use awk for safe replacement with special characters
            awk -v key="$OPENAI_API_KEY" '{gsub(/__OPENAI_API_KEY__/, key); print}' "$f" > "$f.tmp" && mv "$f.tmp" "$f"

            echo "After injection ($f):"
            grep "const apiKey" "$f" || echo "Pattern not found"
          done
          echo "✅ API key injected"

      - name: Verify injection
        run: |
          if grep -rq "__OPENAI_API_KEY__" index.html reviewer/reading.html; then
            echo "❌ ERROR: API key placeholder still exists!"
            grep -n "__OPENAI_API_KEY__" index.html reviewer/reading.html
            exit 1
          else
            echo "✅ API key placeholder replaced successfully"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
